name: Release

# One tag, every channel. Push a tag that matches src/package.json's version:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# and this workflow:
#
#   build        builds the desktop installers on macOS, Windows and Linux
#                runners (the Linux leg runs the test suite first)
#   release      publishes them as a GitHub Release, which hippoherd.com's
#                download buttons read
#   web          copies the game's web build into jfigge/hippoherd and pushes,
#                which redeploys hippoherd.com/duelhippo/
#   ios          archives the iPhone app and uploads it to App Store Connect,
#                where it appears in TestFlight
#   app-store    puts that build up for App Store review
#
# `workflow_dispatch` (the Actions tab) builds everything and publishes
# nothing: no release, no push to hippoherd, no upload. It is how to check
# the certificates and the build before spending a tag.
#
# ── Secrets and variables (Settings → Secrets and variables → Actions) ──────
# All optional. A channel whose secrets are missing is skipped with a notice,
# and nothing else fails because of it. The names are the herd's, so values
# from Rest Hippo's or Chip Hippo's repository can be copied over as they are.
#
#   Desktop signing (macOS):
#     CSC_LINK, CSC_KEY_PASSWORD          Developer ID Application .p12, base64
#     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization
#   App Store Connect API key (iOS upload and review; notarization too, if
#   the three above are not set):
#     APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_BASE64   the .p8, base64
#   iOS distribution certificate, optional:
#     APPLE_DIST_CSC_LINK, APPLE_DIST_CSC_KEY_PASSWORD
#       An "Apple Distribution" .p12 (the one Chip Hippo's MAS_CSC_LINK
#       holds works: Apple Distribution certificates cover iOS and macOS).
#       Without it, Xcode's cloud signing makes one, which needs the API key
#       to have the Admin role.
#   Website:
#     HIPPOHERD_TOKEN    a fine-grained token with Contents: read and write on
#                        jfigge/hippoherd and nothing else
#
#   Variables:
#     NET_URL = wss://…           the two-player match server (make
#                                 server-deploy prints it); without it the
#                                 builds offer no two-player
#     APP_STORE_ENABLED = true    turn the ios job on
#     APP_STORE_SUBMIT  = true    and submit each upload for review (without
#                                 it, uploads stop at TestFlight)
#     APP_STORE_RELEASE           AFTER_APPROVAL (default) or MANUAL: what
#                                 happens once Apple approves a new version
#
# Windows and Linux installers are unsigned.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          # Pinned for the reason Chip Hippo's is: on Ubuntu 26.04 the
          # AppImage toolset's bundled libm breaks the host's tools.
          - os: ubuntu-24.04
            platform: linux
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: The tag matches the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but src/package.json says $want"
            exit 1
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      # The suite compares the port with the prototype frame by frame; a
      # release that fails it is not one to ship. One leg is enough.
      - name: Test
        if: matrix.platform == 'linux'
        run: node --test --test-timeout=120000 "app/tests/*.test.js" "web/scripts/tests/*.test.js" "tools/tests/*.test.mjs" "server/tests/*.test.mjs"

      # The match server's address (repository variable NET_URL), so the
      # installers can play two-player.
      - name: Build the web bundle
        env:
          VITE_NET_URL: ${{ vars.NET_URL }}
        run: node_modules/.bin/vite build

      # The secrets arrive under other names and are exported only when set:
      # an empty CSC_LINK reads to electron-builder as a certificate path, and
      # fails the build. Notarization is exported inside the signing branch
      # because notarytool rejects an unsigned app.
      - name: Build installers
        env:
          INPUT_CSC_LINK: ${{ secrets.CSC_LINK }}
          INPUT_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          INPUT_APPLE_ID: ${{ secrets.APPLE_ID }}
          INPUT_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          INPUT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INPUT_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          INPUT_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          INPUT_APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ "${{ matrix.platform }}" = mac ] && [ -n "$INPUT_CSC_LINK" ]; then
            export CSC_LINK="$INPUT_CSC_LINK" CSC_KEY_PASSWORD="$INPUT_CSC_KEY_PASSWORD"
            if [ -n "$INPUT_APPLE_ID" ]; then
              export APPLE_ID="$INPUT_APPLE_ID"
              export APPLE_APP_SPECIFIC_PASSWORD="$INPUT_APPLE_APP_SPECIFIC_PASSWORD"
              export APPLE_TEAM_ID="$INPUT_APPLE_TEAM_ID"
            elif [ -n "$INPUT_APPLE_API_KEY_BASE64" ]; then
              # notarytool takes the App Store Connect key as a file.
              printf '%s' "$INPUT_APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/notary.p8"
              export APPLE_API_KEY_ID="$INPUT_APPLE_API_KEY_ID"
              export APPLE_API_ISSUER="$INPUT_APPLE_API_ISSUER"
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # electron-builder's download of Electron has no retry of its own.
          for attempt in 1 2 3; do
            node_modules/.bin/electron-builder --${{ matrix.platform }} --publish never && exit 0
            echo "::warning::Build attempt $attempt failed"
            sleep $(( attempt * 20 ))
          done
          exit 1

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installers-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: installers-*

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: artifacts/**/*
          # 0.x releases are pre-releases. hippoherd offers a pre-release only
          # while there is no stable one.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ── hippoherd.com/duelhippo/ ──────────────────────────────────────────────
  # `make site`, done here: the web build mirrored into hippoherd's
  # website/duelhippo/ (its about/ page left alone), committed and pushed.
  # hippoherd's own workflow deploys on that push, and as it runs after the
  # release above, the same deploy picks up the new installers.
  web:
    name: Publish to hippoherd.com
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Is there a token for hippoherd?
        id: gate
        env:
          TOKEN: ${{ secrets.HIPPOHERD_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::HIPPOHERD_TOKEN is not set: the web build was not published. Run 'make site' and push hippoherd by hand."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Build the web bundle
        if: steps.gate.outputs.go == 'true'
        working-directory: src
        env:
          VITE_NET_URL: ${{ vars.NET_URL }}
        run: npm ci --no-audit --no-fund && node_modules/.bin/vite build

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: jfigge/hippoherd
          token: ${{ secrets.HIPPOHERD_TOKEN }}
          path: hippoherd

      - name: Copy it in, commit and push
        if: steps.gate.outputs.go == 'true'
        run: |
          mkdir -p hippoherd/website/duelhippo
          rsync -a --delete --exclude /about/ src/www/ hippoherd/website/duelhippo/
          cd hippoherd
          git add website/duelhippo
          if git diff --cached --quiet; then
            echo "::notice::hippoherd already has this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Duel Hippo ${GITHUB_REF_NAME}: the game's web build" \
            -m "From jfigge/duelhippo@${GITHUB_SHA::7} by its Release workflow."
          git push

  # ── The App Store ─────────────────────────────────────────────────────────
  # `make ios-upload`, done here. A dispatch run archives and signs but does
  # not upload: every upload spends a build number for good.
  ios:
    name: iPhone app to App Store Connect
    if: vars.APP_STORE_ENABLED == 'true'
    runs-on: macos-latest
    outputs:
      build: ${{ steps.number.outputs.build }}
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      NET_URL: ${{ vars.NET_URL }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: The tag matches the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./src/package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::Tag $GITHUB_REF_NAME, but src/package.json says $want"; exit 1; }

      # App Store Connect only takes builds made with a current SDK, which is
      # often newer than the runner image's default Xcode.
      - name: Use the newest Xcode on the runner
        run: |
          newest=""
          for x in /Applications/Xcode_*.app; do
            case "$x" in *beta*|*"*"*) continue ;; esac
            newest=$(printf '%s\n%s\n' "$newest" "$x" | sort -V | tail -1)
          done
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version

      # npm ci first, so make finds node_modules up to date and does not run
      # its own install, which would also fetch the Electron binary.
      - name: Install
        working-directory: src
        run: npm ci --no-audit --no-fund

      - name: App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::APP_STORE_ENABLED is true, but APPLE_API_KEY_ID, APPLE_API_ISSUER or APPLE_API_KEY_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Into a keychain of its own, deleted with the runner.
      - name: Distribution certificate
        env:
          P12: ${{ secrets.APPLE_DIST_CSC_LINK }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::notice::No APPLE_DIST_CSC_LINK: relying on Xcode cloud signing (the API key needs the Admin role)."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
          # Added to the search list, ahead of the ones already there (their
          # paths have no spaces; word splitting is what is wanted).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build number
        id: number
        run: echo "build=$(date -u +%y%j%H%M)" >> "$GITHUB_OUTPUT"

      - name: Archive and upload
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            make ios-upload BUILD_NUMBER=${{ steps.number.outputs.build }}
          else
            make ios-archive BUILD_NUMBER=${{ steps.number.outputs.build }}
            echo "::notice::Archived and signed, not uploaded: only a tag uploads."
          fi

  app-store:
    name: Submit for App Store review
    needs: ios
    if: startsWith(github.ref, 'refs/tags/') && vars.APP_STORE_SUBMIT == 'true'
    runs-on: ubuntu-latest
    # Apple's processing of an upload usually takes minutes, sometimes an hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Submit
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_B64" | base64 --decode > "$APPLE_API_KEY"
          node src/tools/asc-submit.mjs \
            --version "$(node -p "require('./src/package.json').version")" \
            --build "${{ needs.ios.outputs.build }}" \
            --release "${{ vars.APP_STORE_RELEASE || 'AFTER_APPROVAL' }}"
