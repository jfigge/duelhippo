name: Match server

# Deploys src/server (Duel Hippo's two-player match server, a Cloudflare
# Worker) when it changes on main, after its tests pass. Needs two
# repository secrets; without them the job says so and stops:
#
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account it deploys to
#
# The server's address does not change between deploys, so nothing else
# needs to know one happened. The board's rude-initials list lives with the
# game (src/web/scripts/rude.js) and is bundled into the server, so a change
# there deploys it too.
on:
  push:
    branches: [main]
    paths:
      - "src/server/**"
      - "src/web/scripts/rude.js"
      - ".github/workflows/server.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/server/package-lock.json

      - name: Test
        run: node --test "tests/*.test.mjs"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set: tested, not deployed."
            exit 0
          fi
          npm ci --no-audit --no-fund
          node_modules/.bin/wrangler deploy
